
services:
  app:
    container_name: holdingshub-app-prod
    image: holdingshub:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_APP_ORIGIN: ${PUBLIC_URL}
    env_file:
      - .env.docker
    environment:
      - NEXT_PUBLIC_APP_ORIGIN=${PUBLIC_URL}  # runtime, but note: NEXT_PUBLIC_* is baked at build for client bundle
      - PORT=3000
      - NEXT_CACHE_DIR=/tmp/next-cache
    restart: unless-stopped
    networks:
      - web
    healthcheck:
      test: ["CMD-SHELL", "node -e 'http=require(\"http\");http.get(\"http://127.0.0.1:3000/api/health\",r=>process.exit(r.statusCode===200?0:1)).on(\"error\",()=>process.exit(1));' "]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  caddy:
    container_name: holdingshub-caddy
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - SITE_DOMAIN=${SITE_DOMAIN}
    depends_on:
      - app
    networks:
      - web

  prices:
    container_name: holdingshub-prices-prod
    image: node:22-alpine
    working_dir: /app
    # Install deps if needed, then run the streamer (TypeScript via tsx)
    command: sh -lc '[ -d node_modules ] || npm ci; npm run prices:stream'
    environment:
      - NODE_ENV=development
    env_file:
      - .env.docker
    volumes:
      - /opt/holdingshub:/app
    restart: unless-stopped
    depends_on:
      - app
    networks:
      - web

volumes:
  caddy_data:
  caddy_config:

networks:
  web:
    driver: bridge
